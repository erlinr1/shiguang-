  <div class="app-shell" id="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#/today" aria-label="拾词首页">
        <img src="assets/img/logo.svg" alt="" class="brand-mark">
        <span class="brand-text"><strong>拾词</strong><em>WORDGLEAM</em></span>
      </a>

      <nav class="nav" aria-label="主导航">
        <a href="#/today" data-nav="today"><svg><use href="#i-home"/></svg><span>今日</span><small>Today</small></a>
        <a href="#/library" data-nav="library"><svg><use href="#i-library"/></svg><span>词库</span><small>Library</small></a>
        <a href="#/review" data-nav="review"><svg><use href="#i-review"/></svg><span>复习</span><small>Review</small><b class="nav-dot" id="review-dot" hidden></b></a>
        <a href="#/mistakes" data-nav="mistakes"><svg><use href="#i-target"/></svg><span>错词本</span><small>Mistakes</small></a>
        <a href="#/stats" data-nav="stats"><svg><use href="#i-stats"/></svg><span>统计</span><small>Progress</small></a>
        <a href="#/settings" data-nav="settings"><svg><use href="#i-settings"/></svg><span>设置</span><small>Settings</small></a>
      </nav>

      <div class="sidebar-bottom">
        <div class="mini-streak">
          <span class="mini-flame"><svg><use href="#i-flame"/></svg></span>
          <div><strong id="side-streak">0</strong><span>天连续学习</span></div>
        </div>
        <button class="profile-chip" data-action="open-settings" type="button">
          <span class="avatar" id="side-avatar">拾</span>
          <span class="profile-copy"><strong id="side-name">单词旅人</strong><em id="side-level">刚开始</em></span>
          <svg class="chev"><use href="#i-chevron"/></svg>
        </button>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <button class="icon-btn mobile-menu" data-action="toggle-nav" aria-label="打开菜单"><svg><use href="#i-dots"/></svg></button>
        <div class="topbar-title">
          <span class="eyebrow" id="page-eyebrow">TODAY</span>
          <h1 id="page-title">今日</h1>
        </div>
        <div class="topbar-actions">
          <div class="streak-chip" title="连续学习天数"><svg><use href="#i-flame"/></svg><strong id="top-streak">0</strong><span>天</span></div>
          <button class="icon-btn" data-action="toggle-theme" aria-label="切换主题" title="切换明暗主题"><svg id="theme-icon"><use href="#i-moon"/></svg></button>
          <button class="avatar avatar-btn" data-action="open-settings" id="top-avatar" aria-label="打开设置">拾</button>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1">
        <div class="skeleton-page">
          <div class="sk sk-title"></div>
          <div class="sk sk-hero"></div>
          <div class="sk-row"><div class="sk sk-card"></div><div class="sk sk-card"></div></div>
        </div>
      </main>
    </div>

  <nav class="mobile-nav" aria-label="移动端导航">
    <a href="#/today" data-nav="today"><svg><use href="#i-home"/></svg><span>今日</span></a>

    <a href="#/review" data-nav="review"><span class="mobile-nav-main"><svg><use href="#i-review"/></svg></span><span>复习</span></a>
    <a href="#/stats" data-nav="stats"><svg><use href="#i-stats"/></svg><span>统计</span></a>
    <a href="#/settings" data-nav="settings"><svg><use href="#i-settings"/></svg><span>我的</span></a>
  </nav>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <div class="boot-screen" id="boot-screen">
    <div class="boot-mark"><img src="assets/img/logo.svg" alt=""><span class="boot-ring"></span></div>
    <p>正在拾起今天的词…</p>
  </div>
